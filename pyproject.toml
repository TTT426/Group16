[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group16-context-engine"
version = "0.1.0"
description = "Cross-tool AI integration layer: ask questions across GitHub / Notion / Discord with cited sources."
requires-python = ">=3.11"
dependencies = [
  # Core: pure-Python or widely available wheels only, so it installs on any OS / CPU.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "anthropic>=2.12",  # Anthropic API provider (official SDK); pure Python
]

[project.optional-dependencies]
# Semantic search with a small ONNX model (no torch). Without it, search falls back to keyword-style hashing.
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
