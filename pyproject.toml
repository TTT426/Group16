[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group16-context-engine"
version = "0.1.0"
description = "Cross-tool AI integration layer: ask questions across GitHub / Notion / Discord with cited sources."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "anthropic>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
# pgserver: embedded PostgreSQL + pgvector so DB tests run without Docker
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pgserver>=0.1.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
