<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>連接工具｜專案脈絡查詢</title>
  <link rel="stylesheet" href="/static/app.css?v=0.2.1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">專案脈絡查詢</a>
    <nav class="nav" aria-label="頁面">
      <a href="/">查詢</a>
      <a href="/decisions">決策紀錄</a>
      <a href="/observer">評估</a>
      <a href="/connect" aria-current="page">連接工具</a>
    </nav>
    <span class="status" id="status">連線中…</span>
  </header>

  <main class="narrow">
    <h1>連接你們的工具</h1>
    <p class="lede">把團隊的 GitHub、Notion、Discord 接上來，查詢和 AI 回答才會用到你們真正的討論。沒有連接時，用的是內建的示範情境。</p>

    <p class="notice" id="first-time" hidden><b>第一步：</b>連接你們團隊的 GitHub repo，大約一分鐘。</p>

    <section class="panel tool-card" data-tool="github">
      <header><h2>GitHub</h2><span class="chip" id="github-chip">讀取中…</span></header>
      <p class="what">Issues、Pull requests（含留言與 code review）、repo 裡的 Markdown 文件</p>
      <dl class="facts" id="github-facts" hidden></dl>
      <p class="notice" id="github-msg" hidden></p>
      <div class="row" id="github-actions"></div>
    </section>

    <section class="panel tool-card" data-tool="notion">
      <header><h2>Notion</h2><span class="chip" id="notion-chip">讀取中…</span></header>
      <p class="what">分享給 connection 的頁面（規格、會議紀錄、決策）</p>
      <dl class="facts" id="notion-facts" hidden></dl>
      <p class="notice" id="notion-msg" hidden></p>
      <div class="row" id="notion-actions"></div>
    </section>

    <section class="panel tool-card soon" data-tool="discord">
      <header><h2>Discord</h2><span class="chip">即將推出</span></header>
      <p class="what">頻道訊息與討論串</p>
    </section>
  </main>

  <script type="module">
    import { api, h, loadStatus } from "/static/common.js?v=0.2.0";

    const $ = (id) => document.getElementById(id);
    const waiting = (text) => h("span", { class: "thinking" }, h("span", { class: "pulse", "aria-hidden": "true" }), text);

    // ---- shared card helpers: every tool card has #<tool>-chip, -facts, -msg and -actions ----
    function message(tool, content, kind = "") {
      const el = $(`${tool}-msg`);
      el.className = "notice " + kind;
      el.hidden = !content;
      el.replaceChildren(...(content ? [content] : []));
    }
    function chip(tool, text, kind = "") { const el = $(`${tool}-chip`); el.className = "chip " + kind; el.textContent = text; }
    function facts(tool, rows) {
      const el = $(`${tool}-facts`);
      el.hidden = !rows.length;
      el.replaceChildren(...rows.flatMap(([label, value]) => [h("dt", {}, label), h("dd", {}, value)]));
    }
    function actions(tool, ...buttons) { $(`${tool}-actions`).replaceChildren(...buttons.filter(Boolean)); }
    function connectButton(tool, label) { return h("a", { class: "button primary", href: `/connect/${tool}` }, label); }
    function settingsButton(tool) { return h("a", { class: "button", href: `/connect/${tool}` }, "更改設定"); }

    function importButton(tool, imported, waitText, render) {
      const button = h("button", { class: imported ? "" : "primary", type: "button" }, imported ? "重新匯入" : "匯入資料");
      button.addEventListener("click", async () => {
        button.disabled = true;
        message(tool, waiting(waitText), "ok");
        try {
          const r = await api(`/api/${tool}/import`, { method: "POST" });
          await render();
          message(tool, `完成：讀取了 ${r.imported.documents} 份文件（${r.imported.chunks} 個段落）。`, "ok");
        } catch (e) { message(tool, e.message, "error"); button.disabled = false; }
      });
      return button;
    }
    function disconnectButton(tool, question, render) {
      const button = h("button", { class: "link-button", type: "button" }, "中斷連接");
      button.addEventListener("click", async () => {
        if (!confirm(`${question}已匯入的資料會保留。`)) return;
        await api(`/api/${tool}/disconnect`, { method: "POST" });
        render();
      });
      return button;
    }

    // ---- GitHub ----
    async function renderGitHub() {
      let data;
      try { data = await api("/api/connections"); }
      catch (e) { chip("github", "讀取失敗"); return message("github", e.message, "error"); }
      const g = data.github, acc = g.account;
      $("first-time").hidden = !!g.repo;
      if (!g.repo) {
        chip("github", "尚未連接"); facts("github", []); message("github", "");
        return actions("github", connectButton("github", "連接 GitHub →"));
      }
      const imported = g.documents > 0;
      chip("github", imported ? "已連接" : "尚未匯入", imported && !(acc && acc.error) ? "done" : "warn");
      facts("github", [
        ["Repo", h("a", { href: `https://github.com/${g.repo}`, target: "_blank", rel: "noopener" }, g.repo)],
        ["帳號", !acc ? "未登入（只能讀公開 repo）" : acc.error ? "登入已失效" : [
          acc.avatar_url ? h("img", { class: "avatar", src: acc.avatar_url + "&s=40", alt: "" }) : null,
          `${acc.name}（@${acc.login}）`,
          acc.via === "gh" ? h("span", { class: "muted small" }, " · 使用 GitHub CLI 登入") : null]],
        ["已匯入", `${g.documents} 份文件`],
      ]);
      message("github", acc && acc.error ? `${acc.error}請按「更改設定」重新登入。` : "");
      actions("github",
        importButton("github", imported, "匯入中… repo 越大越久，通常不到一分鐘。", renderGitHub),
        settingsButton("github"),
        disconnectButton("github", `中斷與 ${g.repo} 的連接？`, renderGitHub));
    }

    // ---- Notion ----
    async function renderNotion() {
      let s;
      try { s = await api("/api/notion/status"); }
      catch (e) { chip("notion", "讀取失敗"); return message("notion", e.message, "error"); }
      if (!s.connected) {
        chip("notion", "尚未連接"); facts("notion", []); message("notion", "");
        return actions("notion", connectButton("notion", "連接 Notion →"));
      }
      const c = s.check;
      const pages = c ? `${c.pages.length}${c.more_pages ? "+" : ""} 個頁面` : "—";
      const ready = c && c.pages.length > 0;
      chip("notion", !ready ? "未完成" : s.documents ? "已連接" : "尚未匯入", ready && s.documents ? "done" : "warn");
      facts("notion", [
        ["Connection", c ? `${c.connection}${c.workspace ? `（${c.workspace}）` : ""}` : "—"],
        ["看得到", pages],
        ["已匯入", `${s.documents} 份文件`],
      ]);
      message("notion", s.error ? `${s.error}請按「更改設定」重新設定。`
        : !ready ? "Connection 還看不到任何頁面，請按「更改設定」把頁面分享給它。" : "");
      actions("notion",
        ready ? importButton("notion", s.documents > 0, "匯入中… 頁面越多越久。", renderNotion) : null,
        settingsButton("notion"),
        disconnectButton("notion", "中斷與 Notion 的連接？", renderNotion));
    }

    loadStatus($("status"));
    renderGitHub();
    renderNotion();
  </script>
</body>
</html>
